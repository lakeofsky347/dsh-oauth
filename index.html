<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-oauth · 提供商登录</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./providers.js"></script>
  <script src="./theme.js"></script>
</head>
<body data-ds-dark-theme>
  <div class="app">
    <aside class="nav">
      <p class="brand">dsh-oauth</p>
      <button type="button">密钥</button>
      <button type="button" aria-current="page">OAuth</button>
      <button type="button">模型路由</button>
    </aside>
    <main class="main">
      <p class="kicker">设置 · 初版</p>
      <h1>OAuth 认证</h1>
      <p class="lead">把订阅账号登录进 DeepSeek Harness。点「登录」会直接弹出该提供商的认证页。颜色和登录过程可以通过 DshOAuth.applyTheme、setLoginOpener、onAuthorize 换掉。</p>
      <section class="card">
        <header class="card-head">
          <div>
            <h2 class="head-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 5 6v6c0 4.2 2.8 7.4 7 9 4.2-1.6 7-4.8 7-9V6l-7-3Z"/></svg>
              提供商登录（OAuth）
            </h2>
            <p class="head-desc" id="count"></p>
          </div>
          <button class="icon-btn" id="refresh" type="button" aria-label="刷新">↻</button>
        </header>
        <div class="card-body" id="rows"></div>
      </section>
      <p class="reset"><button class="btn" id="reset" type="button">恢复示例</button></p>
    </main>
  </div>
  <div id="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
