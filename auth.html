<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAuth 登录</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./providers.js"></script>
  <script src="./theme.js"></script>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100%;
    }
    main {
      width: min(420px, calc(100% - 32px));
      background: var(--dsh-oauth-layer1);
      border-radius: var(--dsh-oauth-radius);
      box-shadow: var(--dsh-oauth-shadow);
      padding: 24px;
    }
    .host { margin: 0; color: var(--dsh-oauth-caption); font-size: 12px; }
    h1 { margin: 8px 0; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 20px; color: var(--dsh-oauth-text-secondary); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body data-ds-dark-theme>
  <main>
    <p class="host" id="host"></p>
    <h1 id="title">登录</h1>
    <p id="ask"></p>
    <div class="actions">
      <button type="button" class="btn" id="deny">取消</button>
      <button type="button" class="btn solid" id="allow" hidden>演示授权</button>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get("provider") || "";
    const preview = params.get("preview") === "1";
    const provider = PROVIDERS.find((item) => item.id === id);
    let locale = params.get("locale") === "en" ? "en" : "zh";
    const tr = (zh, en) => locale === "en" ? en : zh;
    const name = provider?.name || id || tr("提供商", "Provider");
    try {
      if (window.opener?.DshOAuth) DshOAuth.applyTheme(window.opener.DshOAuth.getTheme());
    } catch { /* The provider popup may no longer share the opener's origin. */ }
    function render() {
      document.documentElement.lang = locale === "en" ? "en" : "zh-CN";
      document.querySelector("#host").textContent = preview ? tr("dsh-oauth · 静态示例", "dsh-oauth · Static example") : tr("dsh-oauth · 本机授权服务", "dsh-oauth · Local authorization service");
      document.querySelector("#title").textContent = preview ? tr(`${name} 授权示例`, `${name} authorization example`) : tr(`正在启动 ${name} 登录`, `Starting ${name} sign-in`);
      document.querySelector("#ask").textContent = preview
        ? tr("此页仅演示授权界面。继续会记录一个示例连接，不会向提供商登录、获取令牌或写入本机凭据。", "This page demonstrates authorization. Continuing records an example connection without signing in, acquiring tokens or saving credentials.")
        : tr("正在等待本机服务返回授权地址。设备码、补充输入和取消登录按钮会显示在管理面板中。", "Waiting for an authorization URL from the local service. Device codes, additional inputs and cancellation are available in the management panel.");
      document.title = preview ? tr("静态授权示例", "Static authorization example") : tr(`正在启动 ${name} 登录`, `Starting ${name} sign-in`);
      document.querySelector("#allow").hidden = !preview;
      document.querySelector("#allow").textContent = tr("演示授权", "Demo authorization");
      document.querySelector("#deny").textContent = preview ? tr("取消示例", "Cancel example") : tr("关闭窗口", "Close window");
    }
    window.addEventListener("message", (event) => {
      const sameOrigin = location.protocol === "file:" ? event.origin === "null" : event.origin === location.origin;
      if (!sameOrigin || event.source !== window.opener || event.data?.type !== "dsh-oauth-locale") return;
      locale = event.data.locale === "en" ? "en" : "zh";
      render();
    });
    render();

    function finish(ok) {
      if (preview && window.opener) {
        window.opener.postMessage({ type: "dsh-oauth-preview", provider: id, ok }, location.protocol === "file:" ? "*" : location.origin);
      }
      window.close();
    }
    document.querySelector("#allow").addEventListener("click", () => finish(true));
    document.querySelector("#deny").addEventListener("click", () => finish(false));
  </script>
</body>
</html>
